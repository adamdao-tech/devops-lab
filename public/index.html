<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Lab</title>
<meta name="description" content="Praktický trénink DevOps: kvízy, příkazy, hledání chyb v configu a testy na čas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0f0d'/><text x='6' y='22' font-family='monospace' font-size='16' fill='%2346e38a'>&gt;_</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="prompt">&gt;_</span> devops<b>lab</b></a>
  <nav id="nav">
    <a href="#/" data-r="">Přehled</a>
    <a href="#/quiz" data-r="quiz">Kvíz</a>
    <a href="#/cmd" data-r="cmd">Příkazy</a>
    <a href="#/fix" data-r="fix">Najdi chybu</a>
    <a href="#/exam" data-r="exam">Test na čas</a>
    <a href="#/wiki" data-r="wiki">Tahák</a>
    <a href="#/review" data-r="review">Opakování <span id="revc" class="pill"></span></a>
  </nav>
</header>
<main id="app"></main>
<button id="nbtn" class="nbtn" title="Poznámkový blok (N)">📝 <span>Blok</span></button>
<section id="npanel" class="npanel" hidden aria-label="Poznámkový blok">
  <div class="nhead">
    <div class="ntabs"><button data-nt="main" class="on">Blok</button><button data-nt="item" disabled>K úloze</button><button data-nt="all">Vše k úlohám</button></div>
    <button id="nclose" class="nx" title="Zavřít (Esc)">✕</button>
  </div>
  <div data-pane="main" class="npane"><textarea id="nta" spellcheck="false" placeholder="Tvoje poznámky… Ukládají se samy. Tlačítkem „📝 Do bloku“ u úlohy sem vložíš zadání i řešení."></textarea>
    <div class="nfoot"><button class="link" id="ncopy">Kopírovat</button> · <button class="link" id="ndl">Stáhnout .md</button></div></div>
  <div data-pane="item" class="npane" hidden><div id="ninfo" class="ninfo"></div><textarea id="nita" spellcheck="false" placeholder="Poznámka jen k téhle úloze – ukáže se ti, až na ni zase narazíš."></textarea></div>
  <div data-pane="all" class="npane" hidden><div id="nlist" class="nlist"></div></div>
</section>
<footer class="foot">Postup se ukládá jen v tomhle prohlížeči. <button id="exp" class="link">Export</button> · <label class="link">Import<input type="file" id="imp" accept="application/json" hidden></label> · <button id="reset" class="link">Vymazat postup</button></footer>
<script src="data/quiz.js"></script>
<script src="data/cmds.js"></script>
<script src="data/fix.js"></script>
<script src="data/wiki.js"></script>
<script src="app.js"></script>
</body>
</html>
